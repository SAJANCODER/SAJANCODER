  </text>
  <g transform="translate(40, 60)">
    <line x1="8" y1="10" x2="8" y2="40" stroke="#30363D" stroke-width="2" />
    <circle cx="8" cy="6" r="4" fill="#2F81F7" />
    <text x="24" y="10" font-size="12px" fill="#F0F6FC" font-weight="600" class="mono">
      2026
    </text>
    <text x="80" y="10" font-size="12px" fill="#8B949E" font-weight="400">
      Architecting Scalable Emergency Healthcare Locator on Azure.
    </text>
    <line x1="8" y1="50" x2="8" y2="80" stroke="#30363D" stroke-width="2" />
    <circle cx="8" cy="46" r="4" fill="#2F81F7" />
    <text x="24" y="50" font-size="12px" fill="#F0F6FC" font-weight="600" class="mono">
      2025
    </text>
