      2025
    </text>
    <text x="80" y="90" font-size="12px" fill="#8B949E" font-weight="400">
      Initiated active research in Local LLMs &amp; Prompt Engineering.
    </text>
    <circle cx="8" cy="126" r="4" fill="#2F81F7" />
    <text x="24" y="130" font-size="12px" fill="#F0F6FC" font-weight="600" class="mono">
      2024
    </text>
    <text x="80" y="130" font-size="12px" fill="#8B949E" font-weight="400">
