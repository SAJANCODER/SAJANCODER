<svg width="1600" height="420"
viewBox="0 0 1600 420"
fill="none"
xmlns="http://www.w3.org/2000/svg">

<style>

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

svg{
background:#0D1117;
font-family:'IBM Plex Mono',monospace;
}

.title{
font-size:34px;
fill:#F0F6FC;
font-weight:600;
}

.subtitle{
font-size:15px;
fill:#8B949E;
}

.label{
font-size:16px;
fill:#F0F6FC;
}

.small{
font-size:14px;
fill:#8B949E;
}

.panel{
fill:#161B22;
stroke:#30363D;
stroke-width:1.5;
rx:16;
}

.bar-bg{
fill:#21262D;
}

.bar{
fill:#2F81F7;
}

.online{
fill:#238636;
}

.cursor{
animation:blink 1s infinite;
}

.boot1{
animation:fade1 1s forwards;
opacity:0;
}

.boot2{
animation:fade2 2s forwards;
opacity:0;
}

.boot3{
animation:fade3 3s forwards;
opacity:0;
}

.boot4{
animation:fade4 4s forwards;
opacity:0;
}

.progress{
animation:grow 4s ease forwards;
transform-origin:left;
transform:scaleX(0);
}

@keyframes grow{
100%{
transform:scaleX(1);
}
}

@keyframes fade1{
100%{
opacity:1;
}
}

@keyframes fade2{
50%{
opacity:0;
}
100%{
opacity:1;
}
}

@keyframes fade3{
70%{
opacity:0;
}
100%{
opacity:1;
}
}

@keyframes fade4{
85%{
opacity:0;
}
100%{
opacity:1;
}
}

@keyframes blink{
50%{
opacity:0;
}
}

</style>

<rect
x="40"
y="35"
width="1520"
height="350"
rx="18"
fill="#161B22"
stroke="#30363D"/>

<text
x="80"
y="90"
class="title">
VIRLITH OPERATING SYSTEM
</text>

<text
x="80"
y="120"
class="subtitle">
Version 4.0 • Engineering Intelligence Platform
</text>

<line
x1="80"
y1="145"
x2="1520"
y2="145"
stroke="#30363D"/>

<text
x="80"
y="190"
class="label boot1">
Initializing Runtime
</text>

<rect
x="430"
y="174"
width="930"
height="16"
rx="8"
class="bar-bg"/>

<rect
x="430"
y="174"
width="930"
height="16"
rx="8"
class="bar progress"/>

<text
x="80"
y="235"
class="label boot2">
Loading AI Infrastructure
</text>

<circle
cx="438"
cy="229"
r="5"
class="online boot2"/>

<text
x="460"
y="235"
class="small boot2">
DONE
</text>

<text
x="80"
y="275"
class="label boot3">
Synchronizing Repository
</text>

<circle
cx="438"
cy="269"
r="5"
class="online boot3"/>

<text
x="460"
y="275"
class="small boot3">
DONE
</text>

<text
x="80"
y="315"
class="label boot4">
System Integrity
</text>

<text
x="430"
y="315"
fill="#2F81F7"
font-size="18"
class="boot4">
100%
</text>

<text
x="80"
y="360"
fill="#238636"
font-size="18"
class="boot4">
STATUS : ONLINE
</text>

<text
x="260"
y="360"
fill="#F0F6FC"
font-size="18"
class="cursor">
█
</text>

</svg>